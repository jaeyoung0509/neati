<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#0b0d12}canvas{display:block}
</style></head><body><canvas id="c" width="1280" height="720"></canvas>
<img id="s0" src="clean.png" hidden><img id="s1" src="home.png" hidden><img id="s2" src="ai.png" hidden>
<svg width="0" height="0"><path id="m" d="M12 44Q17 31 21 19L15 45C24 19 41 15 42 28C43 35 36 43 43 46Q48 49 54 41"/></svg>
<script>
const W=1280,H=720,DUR=23;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const MARK="M12 44Q17 31 21 19L15 45C24 19 41 15 42 28C43 35 36 43 43 46Q48 49 54 41";
const markPath=new Path2D(MARK), markLen=document.getElementById('m').getTotalLength();
const K=3.3, CX=640, CY=318;                 // mark scale and centre
const OX=CX-32*K, OY=CY-32*K;                // mark origin
const G={x:OX+12*K,y:OY+44*K};               // pen start: where every thread ends
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const out=x=>1-Math.pow(1-x,3);
const lerp=(a,b,m)=>a+(b-a)*m;
const TOOLS=[['Xcode','#6cb6ff'],['Docker','#58c4dc'],['npm','#f47b7b'],['Homebrew','#f2b866'],['Cargo','#e8a27c'],['Ollama','#c9d1d9'],['Claude','#e39a76'],['Codex','#9fe0b0'],['pnpm','#f5d76e'],['Gradle','#7fd1c0'],['CocoaPods','#f08aa6'],['pip','#8fb4ff'],['Simulators','#b79cff'],['node_modules','#a8d672']];
const N=TOOLS.length, r0=rng(7);
const threads=TOOLS.map(([name,color],i)=>{
  const a=-Math.PI/2+(i+.5)/N*Math.PI*2+(r0()-.5)*.12;
  const lx=640+Math.cos(a)*520, ly=318+Math.sin(a)*252;
  const r=rng(100+i*13), waves=[];
  for(let k=0;k<3;k++)waves.push({fx:1.3+r()*4.2,fy:1.3+r()*4.2,px:r()*6.28,py:r()*6.28,ax:.5+r()*.6,ay:.5+r()*.6,sp:(r()-.5)*1.1});
  return{name,color,lx,ly,a,waves,bow:(r()-.5)*90,delay:i*0.09};
});
const SAMPLES=150;
function point(th,s,t,m,wob){
  // tangled: wander toward a knot at the centre
  const e=s*s*(3-2*s);
  let tx=lerp(th.lx,640,e), ty=lerp(th.ly,318,e);
  const amp=128*clamp((s-.12)/.42)*(1-.25*s);
  let dx=0,dy=0;
  for(const w of th.waves){dx+=Math.sin(w.fx*s*6.28+w.px+t*w.sp*wob)*w.ax;dy+=Math.cos(w.fy*s*6.28+w.py-t*w.sp*wob)*w.ay}
  tx+=dx*amp*.62; ty+=dy*amp*.5;
  // resolved: one calm curve into the pen start
  const mx=(th.lx+G.x)/2-Math.sin(th.a)*th.bow, my=(th.ly+G.y)/2+Math.cos(th.a)*th.bow;
  const u=1-s, rx=u*u*th.lx+2*u*s*mx+s*s*G.x, ry=u*u*th.ly+2*u*s*my+s*s*G.y;
  return[lerp(tx,rx,m),lerp(ty,ry,m)];
}
function mix(c,m){const n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return`rgb(${Math.round(lerp(r,255,m))},${Math.round(lerp(g,255,m))},${Math.round(lerp(b,255,m))})`}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function caption(text,a,y=648,size=26,weight=500,color='#e7eaf0'){
  if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.fillStyle=color;ctx.font=`${weight} ${size}px -apple-system,"SF Pro Display","Helvetica Neue",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,640,y);ctx.restore();
}
window.render=function(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.shadowBlur=0;
  ctx.fillStyle='#0b0d12';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(640,318,0,640,318,620);g.addColorStop(0,'rgba(82,119,237,.13)');g.addColorStop(1,'rgba(82,119,237,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const endFade=1-seg(t,22.4,23);                    // dip to black so the loop is seamless
  const m=ease(seg(t,4.6,7.3));                      // untangle
  const wob=1-seg(t,4.6,6.4);
  const retract=ease(seg(t,7.5,9.0));                // threads flow into the pen
  const white=seg(t,6.6,8.2);
  const labelsOut=1-seg(t,7.2,8.0);
  // threads
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const th of threads){
    const grow=out(seg(t,.35+th.delay,2.3+th.delay));
    if(grow<=0||retract>=1)continue;
    const s0=retract, s1=grow;
    if(s1<=s0)continue;
    ctx.beginPath();
    for(let i=0;i<=SAMPLES;i++){const s=lerp(s0,s1,i/SAMPLES);const[x,y]=point(th,s,t,m,wob);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.strokeStyle=mix(th.color,white*.85);ctx.globalAlpha=.86*endFade;ctx.lineWidth=lerp(2.4,3.2,m);
    ctx.shadowColor=th.color;ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;
  }
  for(const th of threads){
    const la=seg(t,.1+th.delay,.7+th.delay)*labelsOut*endFade;
    if(la>0){
      ctx.globalAlpha=la;ctx.font='500 17px "SF Mono",ui-monospace,Menlo,monospace';
      const tw=ctx.measureText(th.name).width, pw=tw+34, ph=32;
      const px=clamp(th.lx-pw/2,16,W-pw-16), py=clamp(th.ly-ph/2,14,596);
      rr(px,py,pw,ph,16);ctx.fillStyle='#141821';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();
      ctx.beginPath();ctx.arc(px+15,py+ph/2,4,0,6.3);ctx.fillStyle=th.color;ctx.fill();
      ctx.fillStyle='#d5dae3';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(th.name,px+25,py+ph/2+1);
    }
  }
  ctx.globalAlpha=1;
  // the mark: one line
  function mark(draw,tile,lift,grow,alpha){
    if(draw<=0||alpha<=0)return;
    ctx.save();
    const sc=lerp(1,.78,lift), cy=lerp(CY,268,lift);
    ctx.translate(CX,cy);ctx.scale(K*sc,K*sc);ctx.translate(-32,-32);
    if(tile>0){
      ctx.globalAlpha=tile*alpha;
      const tg=ctx.createLinearGradient(5,0,54,64);tg.addColorStop(0,'#5277ED');tg.addColorStop(1,'#2865C8');
      ctx.shadowColor='rgba(40,101,200,.55)';ctx.shadowBlur=60*tile;
      rr(0,.846,64,64,14.46);ctx.fillStyle=tg;ctx.fill();ctx.shadowBlur=0;
    }
    ctx.globalAlpha=alpha;ctx.strokeStyle='#fff';ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=lerp(2.2,10,grow);
    ctx.setLineDash([markLen*draw,markLen]);ctx.stroke(markPath);
    ctx.restore();
  }
  mark(ease(seg(t,7.9,9.7)),out(seg(t,9.6,10.5)),0,ease(seg(t,8.6,10.0)),1-seg(t,11.1,11.7));
  // the app itself: three real screens in one window
  const win=out(seg(t,11.5,12.4))*(1-seg(t,19.3,19.9))*endFade;
  if(win>0){
    const ww=900,wh=ww*760/1180,wx=(W-ww)/2,wy=30+(1-out(seg(t,11.5,12.4)))*36;
    const shots=[[s0,11.5,14.6],[s1,14.1,17.0],[s2,16.5,20]];
    ctx.save();ctx.globalAlpha=win;
    ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=50;ctx.shadowOffsetY=18;rr(wx,wy,ww,wh,14);ctx.fillStyle='#f6f6fb';ctx.fill();
    ctx.shadowBlur=0;ctx.shadowOffsetY=0;rr(wx,wy,ww,wh,14);ctx.clip();
    ctx.imageSmoothingQuality='high';
    for(const[img,a,b]of shots){const al=seg(t,a,a+.5);if(al<=0||t>b)continue;ctx.globalAlpha=win*al;ctx.drawImage(img,wx,wy,ww,wh)}
    ctx.globalAlpha=win;
    [['#ff5f57'],['#febc2e'],['#28c840']].forEach(([c],i)=>{ctx.beginPath();ctx.arc(wx+20+i*18,wy+18,5.5,0,6.3);ctx.fillStyle=c;ctx.fill()});
    ctx.restore();
    ctx.save();ctx.globalAlpha=win;rr(wx,wy,ww,wh,14);ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;ctx.stroke();ctx.restore();
  }
  // copy
  const c1=seg(t,1.4,2.2)*(1-seg(t,4.3,4.9));
  const c2=seg(t,5.2,6.0)*(1-seg(t,7.3,7.9));
  const c3=seg(t,8.1,8.8)*(1-seg(t,9.7,10.3));
  caption('Every tool leaves its own trail of caches.',c1);
  caption('neati follows each one back',c2);
  caption('into a single, tidy line.',c3);
  const cy2=672;
  caption('See what is ready to clear, and how much.',seg(t,12.2,12.8)*(1-seg(t,14.0,14.4)),cy2,24);
  caption('One overview of this Mac.',seg(t,14.5,15.0)*(1-seg(t,16.4,16.8)),cy2,24);
  caption('AI tool usage, in the same place.',seg(t,16.9,17.4)*(1-seg(t,19.2,19.7)),cy2,24);
  // end card
  const end=out(seg(t,19.8,20.6))*endFade;
  mark(1,1,1,1,end);
  if(end>0){
    ctx.save();ctx.globalAlpha=end;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='650 64px -apple-system,"SF Pro Display","Helvetica Neue",sans-serif';ctx.fillText('neati',640,lerp(452,440,end));
    ctx.restore();
    caption('Developer storage, untangled.',out(seg(t,20.2,20.9))*endFade,502,26,400,'#aeb6c5');
  }
};
window.DUR=DUR;
const q=new URLSearchParams(location.search);
if(q.has('t'))addEventListener('load',()=>render(+q.get('t')));else addEventListener('load',()=>{const st=performance.now();(function f(){render(((performance.now()-st)/1000)%DUR);requestAnimationFrame(f)})()});
</script></body></html>

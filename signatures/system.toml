# neati Signatures - System & per-user temporary files

[[signatures]]
id = "system.chromium.component_downloads"
name = "Browser Component Downloads"
category = "system"
family = "applications"
risk = "rebuild"
strategy = "owner_provider"
provider_id = "chromium.component_downloads"
platforms = ["macos", "windows"]
paths = []
fail_if_running = [
    "Google Chrome", "Google Chrome Helper", "chrome", "chrome.exe",
    "Brave Browser", "Brave Browser Helper", "brave", "brave.exe",
    "Microsoft Edge", "Microsoft Edge Helper", "msedge", "msedge.exe",
    "Chromium", "Chromium Helper", "chromium", "chromium.exe",
    "Vivaldi", "Vivaldi Helper", "vivaldi", "vivaldi.exe",
    "Arc", "Arc Helper", "arc", "arc.exe"
]
owner = "Chromium browsers"
provider = "Chromium component updater"
artifact_kind = "download_cache"
consequence = "Downloaded component update archives move to Trash. Empty Trash to free disk space; a browser may download them again when an update needs them."
description = "The complete metadata-coupled component_crx_cache store for each supported browser. Installed components, extensions, browser models, credentials, and profile databases stay outside the unit; active or unknown browser process state blocks it."

[[signatures]]
id = "system.chromium.offline_cache_storage"
name = "Browser Offline Website Cache"
category = "system"
family = "applications"
risk = "rebuild"
strategy = "owner_provider"
provider_id = "chromium.offline_cache_storage"
platforms = ["macos", "windows"]
paths = []
fail_if_running = [
    "Google Chrome", "Google Chrome Helper", "chrome", "chrome.exe",
    "Brave Browser", "Brave Browser Helper", "brave", "brave.exe",
    "Microsoft Edge", "Microsoft Edge Helper", "msedge", "msedge.exe",
    "Chromium", "Chromium Helper", "chromium", "chromium.exe",
    "Vivaldi", "Vivaldi Helper", "vivaldi", "vivaldi.exe",
    "Arc", "Arc Helper", "arc", "arc.exe"
]
owner = "Chromium browsers"
provider = "Chromium CacheStorage"
consequence = "Offline website assets move to Trash and may need a network connection to download again. Cookies, passwords, history, local storage, IndexedDB, sessions, and Service Worker registrations stay intact."
description = "Each depth-two CacheStorage directory is a separate reviewed Trash unit. Origin indexes, neighboring profile databases and Service Worker registrations remain intact; macOS checks whether each selected unit is in use, while Windows requires the browser to be stopped."

[[signatures]]
id = "system.chromium.additional_renderer_caches"
name = "Additional Browser and Automation Renderer Caches"
category = "system"
family = "applications"
risk = "rebuild"
strategy = "owner_provider"
provider_id = "chromium.additional_renderer_caches"
platforms = ["macos"]
paths = []
fail_if_running = [
    "Arc", "Arc Helper", "Arc Helper (Renderer)", "Arc Helper (GPU)",
    "Google Chrome Beta", "Google Chrome Beta Helper", "Google Chrome Dev", "Google Chrome Dev Helper",
    "Google Chrome Canary", "Google Chrome Canary Helper", "chrome", "node", "nodejs"
]
owner = "Chromium browsers"
provider = "Chromium renderer cache"
artifact_kind = "renderer_cache"
consequence = "Exact HTTP, code and GPU cache units move to Trash and are downloaded or rebuilt again. Profile data, offline websites, settings, credentials, extensions and models stay."
description = "Bounded direct profiles for verified Arc 1.166.0 / ArcCore154, Chrome Beta/Dev/Canary and the source-verified Chrome DevTools MCP1.10.1 default/CLI channel roots. Arc needs its exact bundle metadata in platform-stated application roots. Every unit retains fresh exact handles and full entry/runtime identity at plan, execution and final mutation; unknown/custom roots, databases, credentials, configuration, models and executables are refused. Persistent or temporary whole automation profiles are never targets."

[[signatures]]
id = "system.developer_temp"
name = "Stale Developer Temporary Files"
category = "system"
family = "developer"
risk = "manual"
strategy = "manual"
unit = "child_namespace"
platforms = ["macos"]
paths = ["$TMPDIR", "${SHARED_TEMP}"]
exclusions = ["$TMPDIR/node-compile-cache", "${SHARED_TEMP}/node-compile-cache"]
include_prefixes = [
    "agent-browser-chrome-",
    "antigravity-",
    "claude-",
    "claude_",
    "codex-",
    "codex_",
    "com.anthropic.",
    "com.openai.",
    "com.brave.",
    "com.google.Chrome.",
    "com.spotify.",
    "com.tinyspeck.",
    "discord-",
    "esbuild-",
    "gemini-",
    "metro-cache",
    "metro-file-map-",
    # The exact node-compile-cache namespace belongs to its owner inventory.
    "node-compile-cache-",
    "neati-",
    "opencode-",
    "opencode_",
    "openai-docs-cache",
    "pytest-of-",
    "tauri-",
    "v8-compile-cache-",
    "vite-"
]
min_age_days = 3
description = "Developer-tool temporary artifacts observed by prefix and age. These hints do not prove ownership or recoverability, so they remain advisory until a dedicated cleaner owns the exact unit."


# neati Signatures - Developer Tools
# Defines scanning patterns and safety rules for compilers, package managers, and build artifacts.

[[signatures]]
id = "dev.dotslash.stale_artifacts"
name = "DotSlash Cached Artifact"
category = "developer"
family = "package_managers"
risk = "rebuild"
strategy = "owner_provider"
provider_id = "dotslash.stale_artifacts"
platforms = ["macos"]
paths = []
fail_if_running = ["dotslash"]
provider = "DotSlash"
artifact_kind = "download_cache"
intensive_only = false
discovery = "always"
consequence = "The selected cached artifact moves to Trash. Empty Trash to free disk space. DotSlash may download and unpack it again on next use."
description = "Completed DotSlash artifacts are available for direct cleanup, including recently downloaded objects. Owner locks, active executables, links, and incomplete artifacts remain protected."

[[signatures]]
id = "dev.homebrew.downloads"
name = "Homebrew Downloads"
category = "developer"
family = "package_managers"
risk = "rebuild"

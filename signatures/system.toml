# ---------------------------------------------------------------------------
# macOS: roots that belong to the system rather than to the profile, plus the
# per-application cache subtrees that the broad cargo-cult roots miss.
#
# Every entry here is discovered in a standard scan; what differs is
# eligibility. An entry marked `intensive_only` reports its bytes as
# `policy_gated` until the user opts into the broader scope, and an entry with
# `intensive_only = false` is eligible as soon as its age policy is satisfied.
# ---------------------------------------------------------------------------

[[signatures]]
id = "system.darwin_user_cache"
name = "System Per-User Cache"
category = "system"
family = "system"
risk = "safe"
strategy = "delete_stale_contents"
platforms = ["macos"]
paths = ["${DARWIN_USER_CACHE}"]
min_age_days = 7
include_prefixes = [
    "com.apple.dyld",
    "com.apple.nsurlsessiond",
    "com.apple.QuickLook.thumbnailcache",
    "com.apple.fonts",
    "com.apple.iconservices",
    "com.apple.appstore",
    "com.apple.helpd",
    "com.apple.parsecd",
]
description = "Entries of the per-user caches the system keeps outside the profile (`/var/folders/<xx>/<yyyy>/C`), which is the sibling of the temporary directory and not reachable through `~/Library/Caches`. Only cache namespaces whose owner is the system itself are eligible: the rest of the tree is inventoried by the broader entry below and stays unselected."

[[signatures]]
id = "system.intensive.darwin_user_cache_other"
name = "Stale Per-User Cache Namespace"
category = "system"
family = "applications"
risk = "rebuild"
strategy = "delete_stale_contents"
platforms = ["macos"]
paths = ["${DARWIN_USER_CACHE}"]
min_age_days = 7
exclude_prefixes = [
    "com.apple.",
    "CloudKit",
    "FamilyCircle",
    "GeoServices",
    "HomeKit",
    "dotslash",
    "ms-playwright",
    "clang",
]
intensive_only = true
discovery = "always"
description = "Entries of third-party cache namespaces under the system per-user cache directory that have been inactive for at least 7 days. Reported in a standard scan as discovered-but-out-of-scope, so a large cache tree is never silently absent from the totals. Opt-in because this root is also where short-lived system caches live."

[[signatures]]
id = "system.app_support_cache_segments"
name = "Application Cache Subtree"
category = "system"
family = "applications"
risk = "safe"
strategy = "delete_directory"
platforms = ["macos"]
paths = [
    "~/Library/Application Support/*/{Cache,CachedData,Code Cache,GPUCache,ShaderCache}",
]
unit = "named_subtree"
min_age_days = 0
exclusions = [
    "~/Library/Application Support/Cursor/Cache",
    "~/Library/Application Support/Cursor/CachedData",
    "~/Library/Application Support/Cursor/Code Cache",
    "~/Library/Application Support/Cursor/GPUCache",
    "~/Library/Application Support/Cursor/ShaderCache",
]
description = "A narrowly named renderer, GPU, or shader cache subtree inside an application's data directory, including recently generated caches. Service Worker CacheStorage is excluded because it can hold offline application state. Cursor has a separate owner-verified cache contract."

[[signatures]]
id = "system.saved_application_state"
name = "Saved Application State"
category = "system"
family = "applications"
risk = "manual"
strategy = "manual"
platforms = ["macos"]
paths = ["~/Library/Saved Application State"]
description = "Window and session restoration state reported for review. It is user-visible state rather than a reconstructible cache, so generic cleanup never removes it."

[[signatures]]
id = "system.xcode_device_support"
name = "Xcode iOS Device Support"
category = "developer"
family = "developer"
risk = "rebuild"
strategy = "delete_directory"
platforms = ["macos"]
paths = ["~/Library/Developer/Xcode/iOS DeviceSupport/*"]
unit = "named_subtree"
min_age_days = 30
provider = "Xcode"
artifact_kind = "build_artifact"
consequence = "Xcode re-downloads the symbol set the next time the device is connected."
fail_if_running = ["Xcode", "xcodebuild", "Simulator", "XCBBuildService"]
description = "Per-OS-version symbol dumps inactive for at least 30 days, while Xcode and Simulator are closed. Recent support sets stay intact."

[[signatures]]
id = "system.intensive.containers_caches"
name = "Sandboxed Application Cache"
category = "system"
family = "applications"
risk = "rebuild"
strategy = "delete_stale_contents"
platforms = ["macos"]
paths = ["~/Library/Containers/*/Data/Library/Caches"]
exclude_prefixes = ["CloudKit", "com.apple.CloudKit", "com.apple.Safari"]
exclusions = ["CloudKit", "com.apple.CloudKit", "com.apple.Safari"]
min_age_days = 0
intensive_only = false
description = "Regenerable container cache payloads are eligible immediately when their owner is idle. CloudKit sync state, Safari website data, structured state, locks and compiled models remain protected. Inaccessible locations are reported explicitly."

[[signatures]]
id = "system.intensive.group_containers_caches"
name = "Group Container Cache"
category = "system"
family = "applications"
risk = "rebuild"
strategy = "delete_stale_contents"
platforms = ["macos"]
paths = ["~/Library/Group Containers/*/Library/Caches"]
exclude_prefixes = ["CloudKit", "com.apple.CloudKit", "com.apple.Safari"]
exclusions = ["CloudKit", "com.apple.CloudKit", "com.apple.Safari"]
min_age_days = 0
intensive_only = false
description = "Regenerable container cache payloads are eligible immediately when their owner is idle. CloudKit sync state, Safari website data, structured state, locks and compiled models remain protected. Inaccessible locations are reported explicitly."

[[signatures]]
id = "system.advisory.macos_system_caches"
name = "System Cache and Log Locations"
category = "system"
family = "system"
risk = "manual"
strategy = "manual"
platforms = ["macos"]
paths = [
    "/Library/Caches",
    "/private/var/log/asl",
    "/private/var/log/DiagnosticMessages",
]
description = "Locations that hold reclaimable bytes the generic cleaner does not remove: they are owned by the system, may need administrator rights, and some are maintained by their own tools. Reported so a scan can explain why its total differs from another cleaner's."

[[signatures]]
id = "system.advisory.device_backups"
name = "Device Backups"
category = "system"
family = "user"
risk = "manual"
strategy = "manual"
platforms = ["macos"]
paths = ["~/Library/Application Support/MobileSync/Backup"]
description = "Local backups of iOS and iPadOS devices. Restoring a device is the only way back from deleting one, so neati reports the space and never offers it for cleanup."

[[signatures]]
id = "system.advisory.simulator_devices"
name = "Simulator Devices"
category = "system"
family = "developer"
risk = "manual"
strategy = "manual"
platforms = ["macos"]
paths = ["~/Library/Developer/CoreSimulator/Devices"]
description = "Simulator device data. Simulators are created and removed through `xcrun simctl`, which also updates the runtime's own registry, so neati reports the space instead of deleting a device out from under it."

# ---------------------------------------------------------------------------
# Windows: the same rules, applied to the roots a Windows profile actually
# accumulates. A broad root (LocalAppData, Roaming, a package tree) is a
# discovery boundary only: the entries below name the disposable subtree inside
# it, never the root itself.
# ---------------------------------------------------------------------------

[[signatures]]
id = "system.windows.roaming_cache_segments"
name = "Roaming Application Cache Subtree"
category = "system"
family = "applications"
risk = "safe"
strategy = "delete_directory"
platforms = ["windows"]
paths = [
    "${ROAMING_APP_DATA}/*/{Cache,CachedData,Code Cache,GPUCache,ShaderCache}",
]
unit = "named_subtree"
min_age_days = 7
description = "A narrowly named renderer, GPU, or shader cache subtree under the roaming profile. Service Worker CacheStorage is excluded because it can hold offline application state."

[[signatures]]
id = "system.windows.temp_known"
name = "Known Developer Temporary Files"
category = "system"
family = "developer"
risk = "manual"
strategy = "manual"
unit = "child_namespace"
platforms = ["windows"]
paths = ["${TEMP}"]
min_age_days = 3
priority = 10
include_prefixes = [
    "agent-browser-chrome-",
    "antigravity-",
    "claude-",
    "claude_",
    "codex-",
    "codex_",
    "com.anthropic.",
    "com.openai.",
    "com.brave.",
    "com.google.Chrome.",
    "com.spotify.",
    "com.tinyspeck.",
    "discord-",
    "esbuild-",
    "gemini-",
    "metro-cache",
    "metro-file-map-",
    "node-compile-cache",
    "opencode-",
    "opencode_",
    "openai-docs-cache",
    "pytest-of-",
    "tauri-",
    "torchinductor_",
    "v8-compile-cache-",
    "vite-",
]
description = "Developer-tool temporary artifacts observed by prefix and age. Prefixes do not prove ownership or recoverability, so these units remain advisory until a dedicated cleaner owns them."

[[signatures]]
id = "system.windows.temp_other"
name = "Temporary Directory Entry"
category = "system"
family = "user"
risk = "rebuild"
strategy = "delete_stale_contents"
platforms = ["windows"]
paths = ["${TEMP}"]
min_age_days = 14
priority = 0
description = "Any other entry in the per-user temporary directory whose contents have not changed for at least 14 days. Reported and never auto-selected: an installer extraction or an application's scratch directory is reclaimable, but only the user can say whether the application that owns it still needs it."

[[signatures]]
id = "system.intensive.windows_user_caches"
name = "Stale Application Cache Subtree"
category = "system"
family = "applications"
risk = "rebuild"
strategy = "delete_directory"
platforms = ["windows"]
paths = ["${LOCAL_APP_DATA}/*/{Cache,Caches,Code Cache,GPUCache,ShaderCache,CacheStorage}"]
unit = "named_subtree"
min_age_days = 7
intensive_only = true
discovery = "always"
description = "The disposable cache subtree an application keeps under its own LocalAppData directory. Discovered in either scope so the bytes are never invisible; eligible only after the user opts into the broader scan, and only when everything inside the subtree has been inactive for at least 7 days."

[[signatures]]
id = "system.intensive.windows_browser_caches"
name = "Browser Profile Cache"
category = "system"
family = "applications"
risk = "rebuild"
strategy = "delete_directory"
platforms = ["windows"]
paths = [
    "${LOCAL_APP_DATA}/Google/Chrome/User Data/*/{Cache,Code Cache,GPUCache}",
    "${LOCAL_APP_DATA}/Microsoft/Edge/User Data/*/{Cache,Code Cache,GPUCache}",
    "${LOCAL_APP_DATA}/BraveSoftware/Brave-Browser/User Data/*/{Cache,Code Cache,GPUCache}",
    "${LOCAL_APP_DATA}/Mozilla/Firefox/Profiles/*/cache2",
    "${ROAMING_APP_DATA}/Mozilla/Firefox/Profiles/*/cache2",
]
unit = "named_subtree"
min_age_days = 7
intensive_only = true
discovery = "always"
description = "Chromium and Firefox transport/code caches, enumerated per profile while cookies, history, bookmarks, passwords, extensions, local storage, sessions, downloads, and Service Worker CacheStorage remain outside the cleanup scope. This Rebuild action is opt-in and only eligible when the exact cache subtree has been inactive for at least 7 days."

[[signatures]]
id = "system.intensive.windows_packages"
name = "Packaged Application Temp State"
category = "system"
family = "applications"
risk = "rebuild"
strategy = "delete_directory"
platforms = ["windows"]
paths = ["${LOCAL_APP_DATA}/Packages/*/{TempState,Temp}"]
unit = "named_subtree"
min_age_days = 7
intensive_only = true
description = "Temporary state written by packaged (MSIX/UWP) applications. Only `TempState` and `Temp` are in scope: `LocalState` and the rest of the package directory hold the application's own data and stay outside the cleanup boundary."

[[signatures]]
id = "system.windows.user_caches"
name = "User Temporary and Cache Locations"
category = "system"
family = "user"
risk = "safe"
strategy = "delete_stale_contents"
platforms = ["windows"]
paths = [
    "${LOCAL_APP_DATA}/CrashDumps",
    "${LOCAL_APP_DATA}/Microsoft/Windows/INetCache",
]
min_age_days = 7
